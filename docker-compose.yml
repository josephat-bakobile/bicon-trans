services:
  web:
    build: .
    image: bicon-trans:latest
    container_name: bicon-trans
    ports:
      - "8081:8000"
    volumes:
      - ./data:/app/data
    environment:
      - DATABASE_PATH=/app/data/bicon_trans.db
      - LEGACY_XLSX_PATH=/app/legacy/MAKUSANYO YA MAGARI - TAKWIMU.xlsx
      - SECRET_KEY=change-me-in-production
      # Login password for the whole system.
      - SITE_PASSWORD=BAKOBILE
      # Beem Africa SMS (driver notifications). Leave unset to disable SMS sending.
      # - BULK_SMS_SECRET_KEY=change-me-beem-secret-key
      # - API_KEY=change-me-beem-api-key
      # - BEEM_SENDER_ID=change-me-registered-sender-id
    restart: unless-stopped
