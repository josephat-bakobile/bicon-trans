<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ingia - BICON TRANS</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="{{ url_for('static', filename='css/app.css') }}" rel="stylesheet">
<link rel="icon" href="{{ url_for('static', filename='images/logo.jpeg') }}">
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height:100vh;">
<div class="card-panel" style="width:100%; max-width:360px;">
  <img src="{{ url_for('static', filename='images/logo.jpeg') }}" alt="BICON TRANS" class="login-logo">

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, message in messages %}
        <div class="alert alert-{{ category }}">{{ message }}</div>
      {% endfor %}
    {% endif %}
  {% endwith %}

  <form method="post">
    <div class="mb-3">
      <label class="form-label">Nenosiri</label>
      <input type="password" class="form-control" name="password" required autofocus>
    </div>
    <button type="submit" class="btn btn-primary w-100">Ingia</button>
  </form>
</div>
</body>
</html>
