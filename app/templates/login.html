<!DOCTYPE html>
<html lang="{{ current_locale }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ _('Ingia') }} - BICON TRANS</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="{{ url_for('static', filename='css/app.css') }}" rel="stylesheet">
<link rel="icon" href="{{ url_for('static', filename='images/logo.jpeg') }}">
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height:100vh; background: radial-gradient(circle at top, #1d3a63 0%, #0b1626 70%);">
<div class="card-panel" style="width:100%; max-width:360px; animation: fadeInUp .5s ease both;">
  <img src="{{ url_for('static', filename='images/logo.jpeg') }}" alt="BICON TRANS" class="login-logo">

  <div class="d-flex justify-content-center gap-2 mb-3">
    <form method="post" action="{{ url_for('auth.set_language', code='sw') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <button type="submit" class="btn btn-sm {{ 'btn-primary' if current_locale == 'sw' else 'btn-outline-secondary' }}">Kiswahili</button>
    </form>
    <form method="post" action="{{ url_for('auth.set_language', code='en') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <button type="submit" class="btn btn-sm {{ 'btn-primary' if current_locale == 'en' else 'btn-outline-secondary' }}">English</button>
    </form>
  </div>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, message in messages %}
        <div class="alert alert-{{ category }}">{{ message }}</div>
      {% endfor %}
    {% endif %}
  {% endwith %}

  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3">
      <label class="form-label"><i class="bi bi-person"></i> {{ _('Jina la Mtumiaji') }}</label>
      <input type="text" class="form-control" name="username" required autofocus autocapitalize="off">
    </div>
    <div class="mb-3">
      <label class="form-label"><i class="bi bi-key"></i> {{ _('Nenosiri') }}</label>
      <input type="password" class="form-control" name="password" required>
    </div>
    <button type="submit" class="btn btn-primary w-100">
      <i class="bi bi-box-arrow-in-right"></i> {{ _('Ingia') }}
    </button>
  </form>
</div>
</body>
</html>
