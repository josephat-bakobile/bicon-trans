{% extends "base.html" %}
{% block title %}Hariri Huduma - BICON TRANS{% endblock %}
{% block content %}

<h4 class="mb-3">Hariri Huduma ya Gari</h4>

<div class="card-panel" style="max-width: 560px;">
  <form method="post">
    <div class="mb-3">
      <label class="form-label">Tarehe ya Huduma</label>
      <input type="date" class="form-control" name="service_date" required
             value="{{ service.service_date.isoformat() }}" max="{{ today_iso }}">
    </div>
    <div class="mb-3">
      <label class="form-label">Gari</label>
      <select class="form-select" name="car_id" required>
        {% for c in cars %}
        <option value="{{ c.id }}" {{ 'selected' if service.car_id == c.id else '' }}>{{ c.code }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="mb-3">
      <label class="form-label">Gharama (si lazima)</label>
      <input type="number" step="0.01" min="0" class="form-control" name="cost" value="{{ service.cost }}">
    </div>
    <div class="mb-3">
      <label class="form-label">Aina ya Matumizi (kama kuna gharama)</label>
      <select class="form-select" name="category_id">
        <option value="">-- chagua --</option>
        {% for cat in categories %}
        <option value="{{ cat.id }}" {{ 'selected' if service.consumption_entry and service.consumption_entry.category_id == cat.id else '' }}>{{ cat.name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="mb-3">
      <label class="form-label">Maelezo (si lazima)</label>
      <textarea class="form-control" name="description" rows="2">{{ service.description or '' }}</textarea>
    </div>
    <div class="mb-3">
      <label class="form-label small mb-0">Msimbo wa Uthibitisho</label>
      <input type="text" class="form-control" name="action_code" required>
    </div>
    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-primary">Hifadhi</button>
      <a href="{{ url_for('service.index') }}" class="btn btn-outline-secondary">Ghairi</a>
    </div>
  </form>
</div>

{% endblock %}
