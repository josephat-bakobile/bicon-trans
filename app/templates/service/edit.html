{% extends "base.html" %}
{% block title %}{{ _('Hariri Tiketi') }} - BICON TRANS{% endblock %}
{% block content %}

<h4 class="mb-3"><i class="bi bi-pencil text-primary"></i> {{ _('Hariri Tiketi ya Huduma') }}</h4>

<div class="card-panel" style="max-width: 560px;">
  <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3">
      <label class="form-label">{{ _('Tarehe ya Huduma') }}</label>
      <input type="date" class="form-control" name="service_date" required
             value="{{ service.service_date.isoformat() }}" max="{{ today_iso }}">
    </div>
    <div class="mb-3">
      <label class="form-label">{{ _('Gari') }}</label>
      <select class="form-select" name="car_id" required>
        {% for c in cars %}
        <option value="{{ c.id }}" {{ 'selected' if service.car_id == c.id else '' }}>{{ c.code }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="mb-3">
      <label class="form-label">{{ _('Maelezo (si lazima)') }}</label>
      <textarea class="form-control" name="description" rows="2">{{ service.description or '' }}</textarea>
    </div>
    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-primary"><i class="bi bi-check2-circle"></i> {{ _('Hifadhi') }}</button>
      <a href="{{ url_for('service.ticket_detail', service_id=service.id) }}" class="btn btn-outline-secondary"><i class="bi bi-x-lg"></i> {{ _('Ghairi') }}</a>
    </div>
  </form>
</div>

{% endblock %}
