{% extends "shop/_layout.html" %}
{% block title %}{{ _('Badilisha Nenosiri') }} - BICON TRANS{% endblock %}
{% block content %}

<h4 class="mb-3"><i class="bi bi-key text-primary"></i> {{ _('Badilisha Nenosiri') }}</h4>

<div class="row">
  <div class="col-lg-5">
    <div class="card-panel">
      <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3">
          <label class="form-label">{{ _('Nenosiri la Sasa') }}</label>
          <input type="password" class="form-control" name="current_password" required autofocus>
        </div>
        <div class="mb-3">
          <label class="form-label">{{ _('Nenosiri Jipya') }}</label>
          <input type="password" class="form-control" name="new_password" required minlength="8">
          <div class="form-text">{{ _('Angalau herufi 8, ikijumuisha herufi na namba.') }}</div>
        </div>
        <div class="mb-3">
          <label class="form-label">{{ _('Thibitisha Nenosiri Jipya') }}</label>
          <input type="password" class="form-control" name="confirm_password" required minlength="8">
        </div>
        <button type="submit" class="btn btn-primary">
          <i class="bi bi-check2-circle"></i> {{ _('Hifadhi Nenosiri Jipya') }}
        </button>
      </form>
    </div>
  </div>
</div>

{% endblock %}
