{% extends "base.html" %}
{% block title %}Magari - BICON TRANS{% endblock %}
{% block content %}

<h4 class="mb-3">Magari</h4>

<div class="row g-4">
  <div class="col-lg-4">
    <div class="card-panel">
      <strong>Ongeza Gari</strong>
      <form method="post" action="{{ url_for('cars.new') }}" class="mt-2">
        <div class="mb-2">
          <label class="form-label">Namba ya Gari (code)</label>
          <input type="text" class="form-control text-uppercase" name="code" placeholder="mfano: DES" required>
        </div>
        <div class="mb-2">
          <label class="form-label">Jina (si lazima)</label>
          <input type="text" class="form-control" name="name">
        </div>
        <div class="mb-2">
          <label class="form-label small mb-0">Msimbo wa Uthibitisho</label>
          <input type="text" class="form-control" name="action_code" required>
        </div>
        <button class="btn btn-primary btn-sm">Ongeza</button>
      </form>
    </div>
  </div>
  <div class="col-lg-8">
    <div class="card-panel">
      <table class="table table-sm align-middle mb-0">
        <thead><tr><th>Code</th><th>Jina</th><th>Hali</th><th></th></tr></thead>
        <tbody>
          {% for c in cars %}
          <tr>
            <td>{{ c.code }}</td>
            <td>{{ c.name or '-' }}</td>
            <td>
              {% if c.active %}<span class="badge text-bg-success">Active</span>
              {% else %}<span class="badge text-bg-secondary">Imezimwa</span>{% endif %}
            </td>
            <td class="text-end">
              <form method="post" action="{{ url_for('cars.toggle', car_id=c.id) }}" class="action-code-form">
                <button class="btn btn-sm btn-outline-secondary">{{ 'Zima' if c.active else 'Washa' }}</button>
              </form>
            </td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
</div>

{% endblock %}
